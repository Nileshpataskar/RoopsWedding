<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000">
  <!-- PLACEHOLDER: replace with a real couple photograph (see lib/wedding-config.ts) -->
  <defs>
    <radialGradient id="bg" cx="55%" cy="45%" r="75%">
      <stop offset="0" stop-color="#fbf4ec"/>
      <stop offset="0.6" stop-color="#efdfd1"/>
      <stop offset="1" stop-color="#dcc2ae"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f1dcae"/>
      <stop offset="0.45" stop-color="#c6a779"/>
      <stop offset="0.7" stop-color="#e8d2a2"/>
      <stop offset="1" stop-color="#9c7d4f"/>
    </linearGradient>
    <radialGradient id="petal" cx="40%" cy="35%" r="70%">
      <stop offset="0" stop-color="#fbeee8"/>
      <stop offset="0.7" stop-color="#ebcbc0"/>
      <stop offset="1" stop-color="#d7a79c"/>
    </radialGradient>
    <radialGradient id="cream" cx="40%" cy="35%" r="70%">
      <stop offset="0" stop-color="#fffaf2"/>
      <stop offset="1" stop-color="#ead9c4"/>
    </radialGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#6b4f3a" flood-opacity="0.25"/>
    </filter>
    <g id="rose">
      <circle r="62" fill="url(#petal)"/>
      <path d="M-40 -10 C -30 -50 30 -55 42 -12 C 30 -30 -20 -32 -40 -10Z" fill="#f6e2da" opacity="0.8"/>
      <path d="M0 0 m -8 0 a 8 8 0 1 1 16 0 a 18 18 0 1 1 -34 2 a 30 30 0 1 1 54 4 a 42 42 0 1 1 -72 6" fill="none" stroke="#c4897d" stroke-width="3" opacity="0.6"/>
    </g>
    <g id="leaf">
      <path d="M0 0 C 30 -30 80 -30 110 0 C 80 30 30 30 0 0Z" fill="#9aa47e"/>
      <path d="M0 0 L 100 0" stroke="#76825a" stroke-width="2"/>
    </g>
  </defs>

  <rect width="800" height="1000" fill="url(#bg)"/>
  <!-- soft bokeh -->
  <g filter="url(#soft)" opacity="0.55">
    <circle cx="140" cy="160" r="70" fill="#fff"/>
    <circle cx="650" cy="260" r="90" fill="#f6e3d8"/>
    <circle cx="560" cy="820" r="110" fill="#fff"/>
    <circle cx="220" cy="640" r="60" fill="#f3d9cf"/>
  </g>

  <!-- top-right roses -->
  <g transform="translate(690 120)">
    <use href="#leaf" transform="translate(-60 40) rotate(150)"/>
    <use href="#leaf" transform="translate(-20 90) rotate(110)"/>
    <use href="#rose" transform="scale(1.3)"/>
    <use href="#rose" transform="translate(-140 -10) scale(0.85)" opacity="0.95"/>
    <circle cx="-70" cy="120" r="46" fill="url(#cream)"/>
  </g>

  <!-- bottom-left roses -->
  <g transform="translate(120 880)">
    <use href="#leaf" transform="translate(40 -60) rotate(-40)"/>
    <use href="#leaf" transform="translate(120 -10) rotate(-10)"/>
    <use href="#leaf" transform="translate(20 -100) rotate(-80)"/>
    <use href="#rose" transform="scale(1.5)"/>
    <use href="#rose" transform="translate(160 40) scale(1)"/>
    <circle cx="70" cy="-120" r="50" fill="url(#cream)"/>
    <use href="#rose" transform="translate(-40 -170) scale(0.75)"/>
  </g>

  <!-- silk ribbon -->
  <path d="M-20 560 C 180 500 260 700 420 640 C 560 590 640 720 820 660" fill="none" stroke="#efd8cc" stroke-width="34" opacity="0.8"/>
  <path d="M-20 560 C 180 500 260 700 420 640 C 560 590 640 720 820 660" fill="none" stroke="#fff" stroke-width="3" opacity="0.6"/>

  <!-- interlocked rings -->
  <g filter="url(#shadow)" fill="none">
    <ellipse cx="345" cy="470" rx="118" ry="112" stroke="url(#gold)" stroke-width="22"/>
    <ellipse cx="470" cy="500" rx="104" ry="98" stroke="url(#gold)" stroke-width="18"/>
    <!-- redraw a segment of the first ring to interlock -->
    <path d="M447 420 A118 112 0 0 1 461 500" stroke="url(#gold)" stroke-width="22"/>
  </g>
  <ellipse cx="345" cy="470" rx="118" ry="112" fill="none" stroke="#fff6e2" stroke-width="3" opacity="0.6" stroke-dasharray="120 600"/>
  <!-- solitaire -->
  <g transform="translate(345 352)">
    <path d="M-22 6 L0 -28 L22 6 L0 22Z" fill="#fdfcf8" stroke="#d5c7b3" stroke-width="2"/>
    <path d="M-22 6 L22 6 M0 -28 L-8 6 L0 22 L8 6Z" fill="none" stroke="#d5c7b3" stroke-width="1.5"/>
  </g>
</svg>
